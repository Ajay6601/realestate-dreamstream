name: Retrain price model

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      rows:
        description: "Synthetic rows (ignored when a data file is given)"
        default: "8000"
      data_path:
        description: "Optional CSV in realestate-ai with feature columns + sale_price"
        default: ""

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realestate-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: realestate-ai/requirements.txt
      - run: pip install -r requirements.txt
      - name: Train, validate, promote
        run: |
          ARGS="--rows ${{ inputs.rows || '8000' }}"
          [ -n "${{ inputs.data_path }}" ] && ARGS="--data ${{ inputs.data_path }}"
          python -m ml.pipeline --registry artifacts/price_model run $ARGS | tee model-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: price-model-${{ github.run_id }}
          path: |
            realestate-ai/artifacts/price_model
            realestate-ai/model-report.json
          retention-days: 30
