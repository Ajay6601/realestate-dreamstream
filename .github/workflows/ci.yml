name: CI/CD

on:
  push:
    branches: [main, ci-workflows]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Public build-time values so Next can prerender without a linked Supabase project.
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.dGVzdA
  NEXT_PUBLIC_SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.dGVzdA
  NEXT_PUBLIC_SUPABASE_BUCKET_NAME: proposals
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.dGVzdA

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realestate-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: realestate-ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realestate-ai
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: realestate-ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  test-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realestate-ai
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: realestate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d realestate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:pg@localhost:5432/realestate
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_user_pw@localhost:5432/realestate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: realestate-ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -ra

  model-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realestate-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: realestate-ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m ml.pipeline --registry artifacts/price_model run --rows 8000 | tee model-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: price-model
          path: |
            realestate-ai/artifacts/price_model
            realestate-ai/model-report.json

  build-image:
    needs: [web, lint, test-sqlite, test-postgres, model-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: price-model
          path: realestate-ai
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: realestate-ai
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push'
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL not set - image is published; deploy it with your platform of choice."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"${IMAGE}:sha-${GITHUB_SHA::7}\"}"
      - name: Smoke test
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          [ -z "$HEALTH_URL" ] && { echo "PRODUCTION_HEALTH_URL not set - skipping"; exit 0; }
          for i in $(seq 1 12); do
            curl --fail --silent "$HEALTH_URL" && exit 0
            sleep 10
          done
          echo "health check failed after deploy" >&2
          exit 1
