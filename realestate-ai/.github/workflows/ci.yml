name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test-sqlite:
    # unit + ML + e2e API workflows on the fast in-memory backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest

  test-postgres:
    # the same e2e suite on real Postgres, plus RLS + audit-trigger tests (tests/db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: realestate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d realestate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:pg@localhost:5432/realestate
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_user_pw@localhost:5432/realestate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      # tests/conftest.py applies sql/*.sql (idempotent) and creates the app_user login
      - run: pytest -ra

  model-gate:
    # Retrain + validate. Exit code 1 (a failed gate) blocks the pipeline; the promoted
    # registry is shipped to the image build as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements.txt
      - run: python -m ml.pipeline --registry artifacts/price_model run --rows 8000 | tee model-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: price-model
          path: |
            artifacts/price_model
            model-report.json

  build-image:
    needs: [lint, test-sqlite, test-postgres, model-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: price-model, path: . }
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Only from main/tags, gated by the "production" environment (add required reviewers in repo settings).
    if: github.event_name == 'push'
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL not set - image is published; deploy it with your platform of choice."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"${IMAGE}:sha-${GITHUB_SHA::7}\"}"
      - name: Smoke test
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          [ -z "$HEALTH_URL" ] && { echo "PRODUCTION_HEALTH_URL not set - skipping"; exit 0; }
          for i in $(seq 1 12); do
            curl --fail --silent "$HEALTH_URL" && exit 0
            sleep 10
          done
          echo "health check failed after deploy" >&2
          exit 1
